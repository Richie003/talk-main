<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Verification</title>
</head>
<body style="margin:0; padding:0; background-color:#f8f9fa; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#f8f9fa; padding:40px 0;">
    <tr>
      <td align="center">
        <table width="600" cellspacing="0" cellpadding="0" border="0" style="background-color:#ffffff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
          <tr>
            <td align="center" style="padding:40px 20px 20px 20px;">
              <img src="/staticfiles/assets/talk-lg.jpeg" width="50" height="50" alt="" srcset="">
              <h2 style="font-size:24px; color:#333333; margin-top:10px;">Welcome to Talk!</h2>
            </td>
          </tr>
          <tr>
            <td align="left" style="padding:0 40px 20px 40px; color:#555555; font-size:16px; line-height:1.6;">
              <p>Hi {{email}},</p>
              <p>{{content}}</p>
              {% if action_text and link %}
              <p><strong><a href="{{link}}">{{action_text}}</a></strong></p>
              {% endif %}
              <br>
              <p>Thank you for using our service!</p>
              <p>Best regards,</p>
              <hr>
              <p><strong>The Talk Team</strong></p>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:20px 0; border-top:1px solid #eee; font-size:14px; color:#777;">
              <p>
                <a href="https://www.talk.com" style="color:#006DFE; text-decoration:none;">Talk</a> |
                <a href="https://www.talk.com/privacy" style="color:#006DFE; text-decoration:none;">Privacy Policy</a> |
                <a href="https://www.talk.com/terms" style="color:#006DFE; text-decoration:none;">Terms of Service</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
